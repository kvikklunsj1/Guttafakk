<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>Gutta Fakk</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #050505;
      color: #f2f2f2;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    main {
      text-align: center;
      padding: 24px;
      transform: translateY(-2vh);
    }
    .countdown {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: clamp(8px, 1.6vw, 24px);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.055em;
      white-space: nowrap;
    }
    .unit {
      display: flex;
      align-items: baseline;
    }
    .number {
      font-size: clamp(3.5rem, 10vw, 9.5rem);
      font-weight: 300;
      line-height: .9;
    }
    .separator {
      font-size: clamp(2.2rem, 5vw, 5rem);
      font-weight: 200;
      opacity: .32;
      margin: 0 .04em;
    }
    .date {
      margin-top: clamp(24px, 4vw, 42px);
      font-size: clamp(.65rem, 1.1vw, .85rem);
      font-weight: 400;
      letter-spacing: .28em;
      text-transform: uppercase;
      opacity: .32;
    }
    @media (max-width: 600px) {
      .countdown { gap: 5px; }
      .number { font-size: clamp(2.8rem, 14vw, 5rem); }
      .separator { font-size: clamp(1.8rem, 7vw, 3rem); }
      .date { margin-top: 28px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="countdown" aria-label="Nedtelling til 6. mai 2027 klokken 18">
      <div class="unit"><span id="days" class="number">000</span></div>
      <span class="separator">:</span>
      <div class="unit"><span id="hours" class="number">00</span></div>
      <span class="separator">:</span>
      <div class="unit"><span id="minutes" class="number">00</span></div>
      <span class="separator">:</span>
      <div class="unit"><span id="seconds" class="number">00</span></div>
    </div>
    <div class="date">06.05.2027</div>
  </main>

  <script>
    // Turstart: 6. mai 2027 kl. 18:00 norsk tid.
    const target = new Date("2027-05-06T18:00:00+02:00").getTime();

    const els = {
      days: document.getElementById("days"),
      hours: document.getElementById("hours"),
      minutes: document.getElementById("minutes"),
      seconds: document.getElementById("seconds")
    };

    function pad(value, length = 2) {
      return String(value).padStart(length, "0");
    }

    function update() {
      const remaining = Math.max(0, target - Date.now());
      const totalSeconds = Math.floor(remaining / 1000);

      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      els.days.textContent = pad(days, 3);
      els.hours.textContent = pad(hours);
      els.minutes.textContent = pad(minutes);
      els.seconds.textContent = pad(seconds);

      if (remaining <= 0) {
        clearInterval(timer);
        els.days.textContent = "000";
        els.hours.textContent = "00";
        els.minutes.textContent = "00";
        els.seconds.textContent = "00";
      }
    }

    update();
    const timer = setInterval(update, 250);
  </script>
</body>
</html>
